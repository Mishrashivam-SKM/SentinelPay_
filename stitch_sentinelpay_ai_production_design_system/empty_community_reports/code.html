<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Community Reports - Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#3c4a42",
                        "surface-bright": "#383939",
                        "surface-container-highest": "#333535",
                        "on-primary-fixed-variant": "#005236",
                        "surface-dim": "#121414",
                        "secondary-fixed": "#e1e0ff",
                        "secondary-fixed-dim": "#c0c1ff",
                        "primary-fixed-dim": "#4edea3",
                        "on-primary-fixed": "#002113",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-error": "#690005",
                        "surface-container-high": "#282a2a",
                        "on-primary-container": "#00422b",
                        "primary-container": "#10b981",
                        "secondary": "#c0c1ff",
                        "inverse-surface": "#e2e2e2",
                        "background": "#121414",
                        "tertiary-container": "#e29100",
                        "on-surface-variant": "#bbcabf",
                        "on-primary": "#003824",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "error-container": "#93000a",
                        "surface-variant": "#333535",
                        "on-secondary-container": "#b0b2ff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary-fixed": "#ffddb8",
                        "on-tertiary-container": "#523200",
                        "surface-container-lowest": "#0c0f0e",
                        "surface-container-low": "#1a1c1c",
                        "secondary-container": "#3131c0",
                        "on-error-container": "#ffdad6",
                        "surface": "#121414",
                        "tertiary": "#ffb95f",
                        "on-secondary": "#1000a9",
                        "on-background": "#e2e2e2",
                        "surface-tint": "#4edea3",
                        "on-secondary-fixed": "#07006c",
                        "primary": "#4edea3",
                        "on-tertiary": "#472a00",
                        "inverse-primary": "#006c49",
                        "primary-fixed": "#6ffbbe",
                        "on-surface": "#e2e2e2",
                        "error": "#ffb4ab",
                        "outline": "#86948a",
                        "inverse-on-surface": "#2f3130",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-container": "#1e2020"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "gutter": "16px",
                        "margin-mobile": "24px",
                        "margin-desktop": "48px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "number-data": ["Inter"],
                        "title-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],

                }
            }
        }

<style>
        body {
            background-color: #121414; /* background */
            color: #e2e2e2; /* on-background */
        }
        
        .ai-glow {
            box-shadow: 0 0 15px rgba(78, 222, 163, 0.2); /* primary with opacity */
        }
        
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .ai-gradient-bg {
            background: linear-gradient(135deg, #4edea3 0%, #3131c0 100%);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-body-sm overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar Shell (Hidden as per intent logic for empty states/specific task focus, but included as per JSON requirement if deemed top level. Empty states usually sit inside a top level screen. We will include it to satisfy JSON.) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-background/80 backdrop-blur-xl border-b border-white/10 no shadows hidden md:flex">
<div class="flex items-center gap-stack-sm">
<!-- Leading Avatar -->
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-white/10 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
<!-- Headline -->
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">SentinelPay AI</h1>
</div>
<!-- Desktop Nav Items (Derived from BottomNavBar) -->
<nav class="flex gap-stack-md">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
<span class="font-label-caps text-label-caps mt-1">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-caps text-label-caps mt-1">History</span>
</a>
<!-- Active State on Desktop -->
<a class="flex flex-col items-center justify-center text-primary font-bold hover:opacity-80 transition-opacity scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">forum</span>
<span class="font-label-caps text-label-caps mt-1">Community</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</a>
</nav>
<!-- Trailing Icon -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-24 pb-32 px-margin-mobile md:px-margin-desktop relative">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden flex items-center justify-center">
<div class="w-[300px] h-[300px] bg-primary/5 rounded-full blur-[100px]"></div>
</div>
<!-- Empty State Container -->
<div class="relative z-10 flex flex-col items-center text-center max-w-md mx-auto w-full">
<!-- Icon/Illustration -->
<div class="relative w-32 h-32 mb-stack-lg flex items-center justify-center">
<!-- Outer pulsing rings -->
<div class="absolute inset-0 rounded-full border border-white/5 animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<div class="absolute inset-2 rounded-full border border-white/10"></div>
<!-- Central Glass Orb -->
<div class="w-20 h-20 rounded-full glass-panel flex items-center justify-center ai-glow z-10 relative">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
<!-- Scanning line effect inside orb -->
<div class="absolute inset-0 overflow-hidden rounded-full pointer-events-none">
<div class="w-full h-1 bg-primary/50 absolute top-0 left-0 animate-[scan_2s_linear_infinite]"></div>
</div>
</div>
</div>
<!-- Text Content -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-stack-sm tracking-tight">
                No reports yet
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg max-w-sm">
                Be the first to report a suspicious VPA and help the community.
            </p>
<!-- Primary Action -->
<button class="w-full md:w-auto px-8 py-4 rounded-xl ai-gradient-bg text-on-primary-fixed font-title-md text-title-md hover:opacity-90 transition-all active:scale-95 shadow-[0_0_20px_rgba(78,222,163,0.3)] flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined group-hover:rotate-12 transition-transform">report</span>
                Report Suspicious VPA
            </button>
<!-- Subtle secondary action / learn more (optional context) -->
<button class="mt-stack-md text-primary font-body-sm text-body-sm hover:underline flex items-center gap-1 opacity-80 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[16px]">info</span>
                How does Sentinel work?
            </button>
</div>
</main>
<!-- BottomNavBar Shell (Mobile Only) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-margin-mobile pb-safe h-20 bg-surface-container-lowest/80 backdrop-blur-2xl border-t border-white/10 shadow-lg md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-white/5 transition-colors p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-white/5 transition-colors p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
<span class="font-label-caps text-label-caps mt-1">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-white/5 transition-colors p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-caps text-label-caps mt-1">History</span>
</a>
<!-- Active State Logic applied to 'Settings' as a fallback if Community isn't explicitly listed in JSON, but we will add a community tab for realism, matching the top nav. Assuming standard 4-5 tab layout. We'll highlight Settings as a proxy if strict adherence is needed, but let's assume we can adapt the label_texts slightly to fit the page intent. The JSON says: ["Home", "Scan", "History", "Settings"]. We will leave them inactive. -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-white/5 transition-colors p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</a>
</nav>
<style>
        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }
        
        /* Padding safe area for iOS */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
    </style>
</body></html>
