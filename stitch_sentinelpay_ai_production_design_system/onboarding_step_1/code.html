<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - How it works</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#333535",
                        "tertiary": "#ffb95f",
                        "surface-container": "#1e2020",
                        "on-primary-fixed": "#002113",
                        "on-tertiary-container": "#523200",
                        "outline": "#86948a",
                        "secondary": "#c0c1ff",
                        "on-secondary-fixed": "#07006c",
                        "on-tertiary": "#472a00",
                        "surface-tint": "#4edea3",
                        "surface": "#121414",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#e29100",
                        "primary": "#4edea3",
                        "outline-variant": "#3c4a42",
                        "primary-container": "#10b981",
                        "surface-dim": "#121414",
                        "on-primary": "#003824",
                        "on-primary-fixed-variant": "#005236",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#4edea3",
                        "inverse-on-surface": "#2f3130",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-primary-container": "#00422b",
                        "background": "#121414",
                        "surface-variant": "#333535",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-bright": "#383939",
                        "primary-fixed": "#6ffbbe",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "surface-container-low": "#1a1c1c",
                        "surface-container-high": "#282a2a",
                        "on-secondary-container": "#b0b2ff",
                        "error": "#ffb4ab",
                        "on-secondary": "#1000a9",
                        "inverse-primary": "#006c49",
                        "on-surface": "#e2e2e2",
                        "on-background": "#e2e2e2",
                        "on-surface-variant": "#bbcabf",
                        "surface-container-lowest": "#0c0f0e",
                        "inverse-surface": "#e2e2e2",
                        "secondary-fixed": "#e1e0ff",
                        "secondary-container": "#3131c0",
                        "on-tertiary-fixed": "#2a1700",
                        "tertiary-fixed": "#ffddb8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "margin-mobile": "24px",
                        "margin-desktop": "48px",
                        "gutter": "16px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "number-data": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "number-data": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .ai-glow {
            box-shadow: 0 0 15px 0 rgba(78, 222, 163, 0.2);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.secondary'));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .ai-gradient-bg {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.secondary'));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Elements -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-[400px] flex flex-col px-margin-mobile z-10 relative h-[100dvh] py-8">
<!-- Header / Skip -->
<header class="flex justify-end w-full pt-4">
<button aria-label="Skip onboarding" class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer">
                Skip
            </button>
</header>
<!-- Illustration Area -->
<div class="flex-grow flex flex-col items-center justify-center w-full py-stack-lg">
<div class="relative w-48 h-48 mb-stack-lg flex items-center justify-center glass-panel rounded-full ai-glow">
<!-- Abstract Shield/Eye Concept -->
<div class="absolute inset-0 border-[0.5px] border-white/10 rounded-full animate-[spin_10s_linear_infinite]"></div>
<div class="absolute inset-4 border border-primary/20 rounded-full"></div>
<div class="absolute inset-8 border border-secondary/20 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
<span class="material-symbols-outlined text-[80px] text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                    security
                </span>
<!-- Scanning line effect -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/50 to-transparent animate-[bounce_3s_ease-in-out_infinite]"></div>
</div>
<!-- Typography -->
<div class="text-center space-y-stack-sm max-w-[320px]">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">
                    Your Invisible <br/>
<span class="gradient-text">Guardian</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    We analyze every transaction in real-time, operating silently in the background to ensure your money stays safe.
                </p>
<!-- Privacy Badge -->
<div class="mt-stack-md inline-flex items-center gap-2 bg-surface-container-high rounded-full px-4 py-2 border border-white/5">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">
                        lock
                    </span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-wider">Zero-Knowledge Architecture</span>
</div>
</div>
</div>
<!-- Footer / Controls -->
<footer class="w-full pb-safe flex flex-col items-center gap-stack-lg mt-auto pt-8">
<!-- Progress Dots -->
<div aria-valuemax="3" aria-valuemin="1" aria-valuenow="1" class="flex gap-2 mb-2" role="progressbar">
<div class="w-8 h-1.5 rounded-full ai-gradient-bg"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Primary Action -->
<button class="w-full ai-gradient-bg text-on-primary font-title-md text-title-md py-4 rounded-xl flex items-center justify-center gap-2 hover:opacity-90 transition-opacity transform active:scale-[0.98]">
<span>Continue</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">
                    arrow_forward
                </span>
</button>
</footer>
</main>
</body></html>
