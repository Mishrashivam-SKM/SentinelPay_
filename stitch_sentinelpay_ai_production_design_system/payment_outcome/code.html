<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SentinelPay AI - Payment Outcome Report</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#10b981",
                        "surface": "#121414",
                        "surface-variant": "#333535",
                        "surface-dim": "#121414",
                        "outline-variant": "#3c4a42",
                        "inverse-on-surface": "#2f3130",
                        "surface-bright": "#383939",
                        "error": "#ffb4ab",
                        "tertiary": "#ffb95f",
                        "secondary": "#c0c1ff",
                        "on-tertiary-container": "#523200",
                        "on-tertiary-fixed": "#2a1700",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-primary-fixed-variant": "#005236",
                        "secondary-fixed": "#e1e0ff",
                        "secondary-container": "#3131c0",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-secondary": "#1000a9",
                        "surface-container-low": "#1a1c1c",
                        "on-primary-container": "#00422b",
                        "background": "#121414",
                        "surface-container-highest": "#333535",
                        "tertiary-fixed": "#ffddb8",
                        "surface-container": "#1e2020",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-secondary-container": "#b0b2ff",
                        "surface-container-lowest": "#0c0f0e",
                        "surface-container-high": "#282a2a",
                        "on-primary-fixed": "#002113",
                        "on-tertiary": "#472a00",
                        "error-container": "#93000a",
                        "outline": "#86948a",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#e2e2e2",
                        "on-error": "#690005",
                        "on-surface-variant": "#bbcabf",
                        "on-surface": "#e2e2e2",
                        "on-secondary-fixed": "#07006c",
                        "primary-fixed-dim": "#4edea3",
                        "primary-fixed": "#6ffbbe",
                        "surface-tint": "#4edea3",
                        "primary": "#4edea3",
                        "on-primary": "#003824",
                        "tertiary-container": "#e29100",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-background": "#e2e2e2",
                        "inverse-primary": "#006c49"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "margin-mobile": "24px",
                        "margin-desktop": "48px",
                        "stack-lg": "32px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "number-data": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "number-data": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #000000; /* AMOLED Black */
        }
        .glass-card {
            background-color: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-effect {
            box-shadow: 0 0 40px rgba(78, 222, 163, 0.1);
        }
        
        /* Pulse animation for the AI icon */
        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .ai-pulse {
            animation: subtle-pulse 3s infinite ease-in-out;
        }

        /* Hover states for the large buttons */
        .action-btn {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .action-btn:active {
            transform: scale(0.97);
        }
        
        /* Success Button */
        .btn-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(16, 185, 129, 0.05) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover, .btn-success:focus {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(16, 185, 129, 0.1) 100%);
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
        }

        /* Failure Button */
        .btn-failure {
            background: linear-gradient(135deg, rgba(255, 180, 171, 0.1) 0%, rgba(255, 180, 171, 0.05) 100%);
            border: 1px solid rgba(255, 180, 171, 0.3);
        }
        .btn-failure:hover, .btn-failure:focus {
            background: linear-gradient(135deg, rgba(255, 180, 171, 0.2) 0%, rgba(255, 180, 171, 0.1) 100%);
            border-color: rgba(255, 180, 171, 0.6);
            box-shadow: 0 4px 20px rgba(255, 180, 171, 0.1);
        }

        /* Neutral Button */
        .btn-neutral {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-neutral:hover, .btn-neutral:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-on-surface flex items-center justify-center p-margin-mobile overflow-hidden">
<!-- Ambient background element to suggest AI presence without overwhelming the AMOLED black -->
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-30 pointer-events-none">
<div class="w-[120vw] h-[1060px] bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-primary/10 via-background to-transparent blur-[100px]"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-md relative z-10">
<!-- Glassmorphic Card Container -->
<div class="glass-card rounded-[24px] p-stack-lg shadow-2xl glow-effect">
<!-- Header Section -->
<header class="flex flex-col items-center text-center mb-stack-lg">
<!-- AI Icon Indicator -->
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center mb-stack-md border border-white/10 ai-pulse shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-sm tracking-tight">
                    Did this payment go through?
                </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                    Help SentinelPay learn by reporting the outcome of your recent transaction.
                </p>
</header>
<!-- Action Buttons Group -->
<div class="flex flex-col gap-stack-md">
<!-- Positive Outcome -->
<button class="action-btn btn-success w-full rounded-xl p-gutter flex items-center justify-between group outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center group-hover:bg-primary/30 transition-colors">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-title-md text-title-md text-primary tracking-wide">Yes, Successful</span>
</div>
<span class="material-symbols-outlined text-primary/50 group-hover:text-primary transition-colors opacity-0 group-hover:opacity-100 transform translate-x-[-10px] group-hover:translate-x-0 transition-all duration-300">chevron_right</span>
</button>
<!-- Negative Outcome -->
<button class="action-btn btn-failure w-full rounded-xl p-gutter flex items-center justify-between group outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-surface">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-error/10 flex items-center justify-center group-hover:bg-error/20 transition-colors">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">cancel</span>
</div>
<span class="font-title-md text-title-md text-error tracking-wide">No, Failed/Cancelled</span>
</div>
<span class="material-symbols-outlined text-error/50 group-hover:text-error transition-colors opacity-0 group-hover:opacity-100 transform translate-x-[-10px] group-hover:translate-x-0 transition-all duration-300">chevron_right</span>
</button>
<!-- Neutral/Unsure Outcome -->
<button class="action-btn btn-neutral w-full rounded-xl p-gutter flex items-center justify-between group outline-none focus:ring-2 focus:ring-on-surface-variant focus:ring-offset-2 focus:ring-offset-surface mt-stack-sm">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-surface-container-highest transition-colors border border-white/5">
<span class="material-symbols-outlined text-on-surface-variant">help</span>
</div>
<span class="font-title-md text-title-md text-on-surface-variant tracking-wide">Not Sure</span>
</div>
</button>
</div>
</div>
</main>
</body></html>
