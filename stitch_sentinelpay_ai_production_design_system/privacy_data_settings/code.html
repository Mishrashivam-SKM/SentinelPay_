<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121414; /* background token fallback */
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4edea3; /* primary */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4edea3; /* primary */
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: white;
        }

<body class="bg-background text-on-background min-h-screen antialiased selection:bg-primary/30">
<!-- Sub-page Header (Task-Focused, suppresses global shell) -->
<header class="sticky top-0 z-50 flex items-center px-margin-mobile h-16 w-full bg-surface/80 backdrop-blur-xl border-b border-white/5">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="flex-1 font-headline-lg-mobile text-headline-lg-mobile text-center text-on-surface pr-8">
            Privacy &amp; Data
        </h1>
</header>
<main class="px-margin-mobile pt-stack-md pb-stack-lg max-w-2xl mx-auto flex flex-col gap-stack-lg">
<!-- Summary Card -->
<section class="relative overflow-hidden rounded-xl bg-surface-container border border-white/10 p-6 shadow-2xl">
<!-- Glassmorphic glow effect -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary/20 rounded-full blur-[40px] pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center text-center gap-stack-sm">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-primary/10 border border-primary/20 mb-2">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<h2 class="font-title-md text-title-md text-on-surface">Your data never leaves your device</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">
                    SentinelPay's AI models run entirely on-device. Your financial data, SMS history, and usage patterns are completely private and never uploaded to our servers.
                </p>
</div>
</section>
<!-- General Settings List -->
<section class="flex flex-col gap-stack-sm">
<h3 class="font-label-caps text-label-caps text-on-surface-variant px-2 uppercase tracking-wider">Access &amp; History</h3>
<div class="bg-surface-container rounded-xl border border-white/5 overflow-hidden flex flex-col divide-y divide-white/5">
<!-- SMS Access Status Row (Toggle) -->
<div class="flex items-center justify-between p-4 hover:bg-surface-variant/30 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">sms</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-medium">SMS Access Status</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Active for local scanning</span>
</div>
</div>
<!-- Modern Toggle Switch -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-container appearance-none cursor-pointer z-10 top-0 left-0 transition-transform duration-300 ease-spring" id="sms-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-highest cursor-pointer transition-colors duration-300" for="sms-toggle"></label>
</div>
</div>
<!-- Parsed Transaction History -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-variant/30 transition-colors text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">receipt_long</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-medium">Parsed Transaction History</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">View locally extracted data</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Export My Data -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-variant/30 transition-colors text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">download</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-medium">Export My Data</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Download a secure JSON archive</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Destructive Action Section -->
<section class="flex flex-col gap-stack-sm pt-4">
<h3 class="font-label-caps text-label-caps text-error px-2 uppercase tracking-wider opacity-80">Danger Zone</h3>
<div class="bg-surface-container rounded-xl border border-error/20 overflow-hidden">
<button class="w-full flex items-center justify-between p-4 hover:bg-error-container/20 transition-colors text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-error/10 flex items-center justify-center">
<span class="material-symbols-outlined text-error">delete_forever</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-error font-medium">Delete All Data</span>
<span class="font-body-sm text-body-sm text-error/70">Permanently erase local AI models and history</span>
</div>
</div>
</button>
</div>
</section>
