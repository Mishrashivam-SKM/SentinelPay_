<style>
        body {
            background-color: #000000; /* True black background as requested */
            color: #e2e2e2;
            overflow: hidden;
        }

        /* Ambient glowing background */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Shield animation */
        .shield-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            animation: float 6s ease-in-out infinite;
        }

        .shield-icon {
            font-size: 80px;
            color: #4edea3; /* Primary color */
            filter: drop-shadow(0 0 20px rgba(78, 222, 163, 0.4));
            position: relative;
            z-index: 2;
        }

        .shield-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(78, 222, 163, 0.2);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }

        .shield-ring::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 4px;
            background-color: #4edea3;
            border-radius: 4px;
            box-shadow: 0 0 10px #4edea3;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Staggered fade in */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.4s; }
        .delay-2 { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
