<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notification Settings - SentinelPay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#10b981",
                        "on-surface-variant": "#bbcabf",
                        "on-secondary-container": "#b0b2ff",
                        "on-primary-container": "#00422b",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "inverse-surface": "#e2e2e2",
                        "surface-container-high": "#282a2a",
                        "outline": "#86948a",
                        "on-background": "#e2e2e2",
                        "surface-tint": "#4edea3",
                        "tertiary-fixed": "#ffddb8",
                        "surface-container-highest": "#333535",
                        "primary-fixed-dim": "#4edea3",
                        "surface-container": "#1e2020",
                        "surface": "#121414",
                        "outline-variant": "#3c4a42",
                        "on-tertiary-fixed": "#2a1700",
                        "on-surface": "#e2e2e2",
                        "background": "#121414",
                        "surface-container-low": "#1a1c1c",
                        "surface-variant": "#333535",
                        "on-primary-fixed-variant": "#005236",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-tertiary-container": "#523200",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#002113",
                        "on-secondary-fixed": "#07006c",
                        "on-secondary": "#1000a9",
                        "tertiary": "#ffb95f",
                        "tertiary-fixed-dim": "#ffb95f",
                        "primary": "#4edea3",
                        "on-primary": "#003824",
                        "on-error": "#690005",
                        "secondary": "#c0c1ff",
                        "secondary-container": "#3131c0",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-tertiary": "#472a00",
                        "surface-bright": "#383939",
                        "inverse-on-surface": "#2f3130",
                        "surface-dim": "#121414",
                        "secondary-fixed": "#e1e0ff",
                        "primary-fixed": "#6ffbbe",
                        "inverse-primary": "#006c49",
                        "surface-container-lowest": "#0c0f0e",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#e29100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "margin-desktop": "48px",
                        "unit": "8px",
                        "margin-mobile": "24px"
                    },
                    "fontFamily": {
                        "number-data": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "number-data": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000000; /* AMOLED Dark */
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: theme('colors.primary');
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: theme('colors.primary');
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: theme('colors.primary');
        }
        
        /* Glassmorphic border */
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- TopAppBar (Modified for Settings sub-page) -->
<header class="bg-surface/80 backdrop-blur-xl dark:bg-surface/80 docked full-width top-0 flat no shadows flex justify-between items-center px-margin-mobile h-16 w-full z-40 border-b border-white/10 transition-transform duration-200">
<button aria-label="Go back" class="text-on-surface dark:text-on-surface hover:opacity-80 transition-opacity p-2 -ml-2 rounded-full focus:outline-none">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim absolute left-1/2 transform -translate-x-1/2">
            Notifications
        </h1>
<!-- Empty div for flex balance -->
<div class="w-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-stack-lg max-w-3xl mx-auto w-full">
<!-- Notification Categories Section -->
<section class="mb-stack-lg animate-fade-in-up" style="animation-delay: 0.1s;">
<h2 class="font-title-md text-title-md text-on-surface mb-stack-md">
                Notification Categories
            </h2>
<div class="glass-panel rounded-xl overflow-hidden shadow-lg">
<!-- Toggle Item: Master Protection Alerts -->
<div class="p-stack-md border-b border-white/5 flex items-start justify-between bg-surface-container-low/50 hover:bg-surface-variant/20 transition-colors">
<div class="flex-grow pr-stack-md">
<h3 class="font-body-lg text-body-lg text-on-surface font-medium mb-1">Master Protection Alerts</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Core protection works even if alerts are off</p>
</div>
<!-- Toggle Switch -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in mt-1">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-300 ease-in-out" id="toggle-master" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300 ease-in-out" for="toggle-master"></label>
</div>
</div>
<!-- Toggle Item: Security Alerts -->
<div class="p-stack-md border-b border-white/5 flex items-center justify-between bg-surface-container-low/50 hover:bg-surface-variant/20 transition-colors">
<div class="flex-grow pr-stack-md">
<h3 class="font-body-lg text-body-lg text-on-surface font-medium">Security Alerts</h3>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-300 ease-in-out" id="toggle-security" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300 ease-in-out" for="toggle-security"></label>
</div>
</div>
<!-- Toggle Item: AI Suggestions -->
<div class="p-stack-md border-b border-white/5 flex items-center justify-between bg-surface-container-low/50 hover:bg-surface-variant/20 transition-colors">
<div class="flex-grow pr-stack-md">
<h3 class="font-body-lg text-body-lg text-on-surface font-medium">AI Suggestions</h3>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-300 ease-in-out" id="toggle-ai" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300 ease-in-out" for="toggle-ai"></label>
</div>
</div>
<!-- Toggle Item: Weekly Protection Summary -->
<div class="p-stack-md flex items-center justify-between bg-surface-container-low/50 hover:bg-surface-variant/20 transition-colors">
<div class="flex-grow pr-stack-md">
<h3 class="font-body-lg text-body-lg text-on-surface font-medium">Weekly Protection Summary</h3>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-300 ease-in-out" id="toggle-weekly" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300 ease-in-out" for="toggle-weekly"></label>
</div>
</div>
</div>
</section>
</main>
<!-- Suppressed BottomNavBar due to Task-Focused intent (Settings sub-page with Back button) -->
<!-- The navigation shell is prioritized out in favor of the content canvas -->
<script>
        // Simple animation logic for toggles (pure visual feedback)
        document.addEventListener('DOMContentLoaded', () => {
            const toggles = document.querySelectorAll('.toggle-checkbox');
            
            toggles.forEach(toggle => {
                toggle.addEventListener('change', function() {
                    const parentRow = this.closest('.p-stack-md');
                    if(this.checked) {
                        parentRow.style.backgroundColor = 'rgba(16, 185, 129, 0.05)'; // slight primary tint
                        setTimeout(() => {
                            parentRow.style.backgroundColor = '';
                        }, 300);
                    } else {
                        parentRow.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
                        setTimeout(() => {
                            parentRow.style.backgroundColor = '';
                        }, 300);
                    }
                });
            });
        });
    </script>
</body></html>
