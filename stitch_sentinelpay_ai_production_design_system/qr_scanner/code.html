<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SentinelPay - QR Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#333535",
                        "tertiary": "#ffb95f",
                        "surface-container": "#1e2020",
                        "on-primary-fixed": "#002113",
                        "on-tertiary-container": "#523200",
                        "outline": "#86948a",
                        "secondary": "#c0c1ff",
                        "on-secondary-fixed": "#07006c",
                        "on-tertiary": "#472a00",
                        "surface-tint": "#4edea3",
                        "surface": "#121414",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#e29100",
                        "primary": "#4edea3",
                        "outline-variant": "#3c4a42",
                        "primary-container": "#10b981",
                        "surface-dim": "#121414",
                        "on-primary": "#003824",
                        "on-primary-fixed-variant": "#005236",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#4edea3",
                        "inverse-on-surface": "#2f3130",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-primary-container": "#00422b",
                        "background": "#121414",
                        "surface-variant": "#333535",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-bright": "#383939",
                        "primary-fixed": "#6ffbbe",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "surface-container-low": "#1a1c1c",
                        "surface-container-high": "#282a2a",
                        "on-secondary-container": "#b0b2ff",
                        "error": "#ffb4ab",
                        "on-secondary": "#1000a9",
                        "inverse-primary": "#006c49",
                        "on-surface": "#e2e2e2",
                        "on-background": "#e2e2e2",
                        "on-surface-variant": "#bbcabf",
                        "surface-container-lowest": "#0c0f0e",
                        "inverse-surface": "#e2e2e2",
                        "secondary-fixed": "#e1e0ff",
                        "secondary-container": "#3131c0",
                        "on-tertiary-fixed": "#2a1700",
                        "tertiary-fixed": "#ffddb8"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit": "8px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "margin-mobile": "24px",
                        "margin-desktop": "48px",
                        "gutter": "16px",
                        "stack-sm": "8px"
                    },
                    fontFamily: {
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "number-data": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "700" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "number-data": ["18px", { lineHeight: "24px", fontWeight: "500" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes scan-line {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .animate-scan {
            animation: scan-line 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        /* Blur background for the active nav item */
        .glass-nav-active {
            backdrop-filter: blur(8px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative font-body-lg">
<!-- Camera Feed Background (Simulated) -->
<div class="absolute inset-0 bg-cover bg-center z-0 scale-105 transform origin-center filter brightness-75" data-alt="A slightly blurred, abstract dark environment simulating a smartphone camera feed looking at a cluttered desk with soft ambient lighting, preparing to scan a QR code. Deep shadows and subtle highlights convey a premium, secure dark-mode aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBxvSevrYhaUPbadikXKcz_vrH968mSSCtXzg_il7mFcVflvhSK4862LaBaalqjdEvAuvFtKTDUQ_umRUNfw61nKREtphrf9jWiFB3kexgB2smCbf0G9bWDfHpN2C26By-Ezgmud93s8ZjJQwEfu4uHEz13bBYdTo6i5GQfaycm7fRfoEZtYNVqUJo24UQXofdKZRykAuYrdVgQEqzbSEimN_MvDTccl2l40SaOBKAoy0eJXC5j52uw')">
</div>
<!-- TopAppBar -->
<header class="absolute top-0 left-0 w-full z-40 flex justify-between items-center px-margin-mobile h-16 docked full-width bg-surface/80 backdrop-blur-xl dark:bg-surface/80 border-b border-white/10 flat no shadows">
<!-- Leading Avatar -->
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-highest border border-white/10 flex items-center justify-center cursor-pointer hover:opacity-80 transition-opacity scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface text-[20px]">person</span>
</div>
<!-- Headline -->
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">
            SentinelPay
        </div>
<!-- Trailing Icon -->
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface dark:text-on-surface hover:bg-white/5 transition-colors scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Scanner Interface -->
<main class="absolute inset-0 z-10 flex flex-col items-center justify-center pt-16 pb-24 pointer-events-none">
<!-- Instructional Text -->
<div class="mb-stack-lg text-center pointer-events-auto">
<p class="font-title-md text-title-md text-white drop-shadow-md">Scan QR Code</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 drop-shadow">Align code within the frame to pay</p>
</div>
<!-- Scanner Viewport Frame -->
<div class="relative w-64 h-64 sm:w-80 sm:h-80 shadow-[0_0_0_9999px_rgba(18,20,20,0.75)] rounded-2xl pointer-events-auto">
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 sm:w-12 sm:h-12 border-t-4 border-l-4 border-primary rounded-tl-2xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 sm:w-12 sm:h-12 border-t-4 border-r-4 border-primary rounded-tr-2xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 sm:w-12 sm:h-12 border-b-4 border-l-4 border-primary rounded-bl-2xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 sm:w-12 sm:h-12 border-b-4 border-r-4 border-primary rounded-br-2xl"></div>
<!-- Animated Scan Line -->
<div class="absolute left-4 right-4 h-[2px] bg-primary animate-scan shadow-[0_0_12px_2px_rgba(78,222,163,0.8)] z-20 rounded-full"></div>
<!-- Target Reticle (Subtle) -->
<div class="absolute inset-0 flex items-center justify-center opacity-30">
<span class="material-symbols-outlined text-primary text-[48px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
</div>
<!-- Quick Actions (Torch/Gallery) -->
<div class="flex gap-gutter mt-stack-lg pointer-events-auto">
<button class="w-14 h-14 rounded-full bg-surface-container/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-on-surface hover:bg-surface-container/60 transition-colors">
<span class="material-symbols-outlined">flashlight_on</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-container/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-on-surface hover:bg-surface-container/60 transition-colors">
<span class="material-symbols-outlined">image</span>
</button>
</div>
<!-- Manual Entry Link -->
<div class="mt-stack-lg pointer-events-auto">
<button class="font-label-caps text-label-caps text-primary uppercase tracking-wider hover:text-primary-fixed transition-colors bg-surface-container/40 backdrop-blur-md px-6 py-3 rounded-full border border-primary/20">
                Enter UPI ID Manually
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-2 pb-safe bg-surface-container/60 backdrop-blur-3xl dark:bg-surface-container/60 border-t border-white/10 shadow-lg docked full-width rounded-t-xl">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:bg-surface-variant/30 spring-bounce transition-transform duration-300 w-16 h-14 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-caps text-[10px] uppercase">Home</span>
</a>
<!-- Scan (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container/20 text-primary dark:text-primary-fixed-dim rounded-full px-4 py-1 hover:bg-surface-variant/30 spring-bounce transition-transform duration-300 w-20 h-14 glass-nav-active border border-primary/20" href="#">
<span class="material-symbols-outlined mb-1" data-icon="qr_code_scanner" data-weight="fill" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-label-caps text-[10px] uppercase font-bold">Scan</span>
</a>
<!-- History (Inactive) -->
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:bg-surface-variant/30 spring-bounce transition-transform duration-300 w-16 h-14 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-caps text-[10px] uppercase">History</span>
</a>
<!-- Settings (Inactive) -->
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:bg-surface-variant/30 spring-bounce transition-transform duration-300 w-16 h-14 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-caps text-[10px] uppercase">Settings</span>
</a>
</nav>
<script>
        // Simple micro-interaction for buttons
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('mousedown', () => {
                el.style.transform = 'scale(0.95)';
            });
            el.addEventListener('mouseup', () => {
                el.style.transform = 'scale(1)';
            });
            el.addEventListener('mouseleave', () => {
                el.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
